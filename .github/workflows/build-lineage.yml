name: Build LineageOS 24.0 (spring)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label: ubuntu-latest (free hosted, 6h limit) or your self-hosted label"
        default: "ubuntu-latest"
        type: string
      build_type:
        description: "Build variant"
        default: "userdebug"
        type: choice
        options:
          - userdebug
          - user
      sync_only:
        description: "Only sync sources and verify trees (no build). Run this first."
        default: true
        type: boolean

env:
  LINEAGE_BRANCH: lineage-24.0
  DEVICE: spring

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1440

    steps:
      - name: Checkout (for local_manifests)
        uses: actions/checkout@v4

      - name: Preflight - list branches of every repo (fast, no download)
        run: |
          export GIT_TERMINAL_PROMPT=0
          for r in \
            android_device_xiaomi_spring \
            android_device_xiaomi_spring-kernel \
            android_vendor_xiaomi_spring \
            android_hardware_qcom-caf_common \
            android_hardware_qcom_audio-ar \
            android_hardware_qcom_display \
            android_vendor_qcom_opensource_agm \
            android_vendor_qcom_opensource_arpal-lx \
            android_vendor_qcom_opensource_audioreach-graphservices \
            android_vendor_qcom_opensource_dataipa \
            android_vendor_qcom_opensource_data-ipa-cfg-mgr
          do
            branches=$(git ls-remote --heads "https://github.com/spring4ever/$r" 2>/dev/null | sed 's#.*refs/heads/##')
            echo "== $r"
            echo "   branches: $(echo $branches)"
            echo "$branches" | grep -qx "lineage-24.0" || echo "::warning::$r has NO lineage-24.0 branch - fix revision in local_manifests/spring.xml"
          done

      - name: Set work directory
        run: echo "WORKDIR=$HOME/lineage" >> "$GITHUB_ENV"

      - name: Free disk space (hosted runner only)
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap (hosted runner only)
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libdw-dev libelf-dev libgnutls28-dev lz4 libssl-dev libxml2 \
            libxml2-utils lzop pngcrush protobuf-compiler python3-protobuf \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          git lfs install

      - name: Repo init
        run: |
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          repo init -u https://github.com/LineageOS/android.git \
            -b "$LINEAGE_BRANCH" --git-lfs --depth=1

      - name: Add local manifests
        run: |
          cd "$WORKDIR"
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE"/local_manifests/*.xml .repo/local_manifests/

      - name: Repo sync
        run: |
          cd "$WORKDIR"
          for i in 1 2 3; do
            repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags && break
            echo "sync failed, retry $i"; sleep 20
          done
          df -h "$WORKDIR"

      - name: Verify required trees exist
        run: |
          cd "$WORKDIR"
          missing=0
          for p in \
            device/xiaomi/spring \
            device/xiaomi/spring-kernel \
            vendor/xiaomi/spring \
            device/qcom/sepolicy_vndr \
            hardware/qcom-caf/common \
            hardware/qcom-caf/sm6375-6.1/audio \
            hardware/qcom-caf/sm6375-6.1/display \
            vendor/qcom/opensource/agm \
            vendor/qcom/opensource/arpal-lx \
            vendor/qcom/opensource/audioreach-graphservices \
            vendor/qcom/opensource/dataipa \
            vendor/qcom/opensource/data-ipa-cfg-mgr
          do
            if [ -d "$p" ]; then echo "OK      $p"; else echo "::error::MISSING $p"; missing=1; fi
          done
          # Files that BoardConfig.mk references directly
          for f in \
            hardware/qcom-caf/sm6375-6.1/audio/primary-hal/configs/common/manifest_non_qmaa.xml \
            hardware/qcom-caf/sm6375-6.1/audio/primary-hal/configs/common/manifest_non_qmaa_extn.xml \
            vendor/xiaomi/spring/BoardConfigVendor.mk \
            device/xiaomi/spring-kernel/images/kernel
          do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "::error::MISSING $f"; missing=1; fi
          done
          # Expected to come from LineageOS itself (warning only)
          for p in hardware/xiaomi vendor/qcom/opensource/usb vendor/qcom/opensource/vibrator hardware/lineage/interfaces; do
            if [ -d "$p" ]; then echo "OK      $p"; else echo "::warning::not found (should come from LineageOS) $p"; fi
          done
          exit $missing

      - name: Build ROM
        if: ${{ !inputs.sync_only }}
        run: |
          cd "$WORKDIR"
          source build/envsetup.sh
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 20G
          breakfast "$DEVICE" "${{ inputs.build_type }}"
          mka bacon

      - name: Upload build output
        if: ${{ !inputs.sync_only }}
        uses: actions/upload-artifact@v4
        with:
          name: lineage-spring
          if-no-files-found: warn
          path: |
            ${{ env.WORKDIR }}/out/target/product/spring/lineage-*.zip
            ${{ env.WORKDIR }}/out/target/product/spring/boot.img
            ${{ env.WORKDIR }}/out/target/product/spring/init_boot.img
            ${{ env.WORKDIR }}/out/target/product/spring/vendor_boot.img
            ${{ env.WORKDIR }}/out/target/product/spring/dtbo.img
